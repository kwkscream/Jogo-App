name: Build and Test Vite App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Navigate to front folder
        run: cd front

      - name: Install dependencies with Yarn
        run: yarn install

      - name: Build Vite app
        run: yarn build

      # Optional: Add steps for testing if you have tests
